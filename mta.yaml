_schema-version: 3.3.0
ID: orders-portal
description: Purchase Order Management Portal
version: 1.0.0

modules:
  # ==================================================
  # 1) CAP SERVICE MODULE (Backend - Node.js)
  # ==================================================
  - name: orders-portal-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: orders-portal-auth
      - name: orders-portal-destination
      - name: orders-portal-connectivity
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
      memory: 512M
      disk-quota: 1024M
    properties:
      NODE_ENV: production
    build-parameters:
      builder: npm-ci

  # ==================================================
  # 2) STANDALONE APPROUTER MODULE
  # Retained for direct CF access and troubleshooting.
  # Work Zone-managed HTML5 launch uses the managed router.
  # ==================================================
  - name: orders-portal
    type: approuter.nodejs
    path: app/router
    requires:
      - name: srv-api
        group: destinations
        properties:
          forwardAuthToken: true
          name: srv-api
          url: ~{srv-url}
      - name: orders-portal-auth
      - name: orders-portal-destination
        group: destinations
        properties:
          forwardAuthToken: false
          name: ui5
          url: https://ui5.sap.com
      - name: orders-portal-repo-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}
    parameters:
      disk-quota: 256M
      keep-existing-routes: true
      memory: 256M

  # ==================================================
  # 3) UI APP CONTENT DEPLOYER
  # Uploads both UI applications into HTML5 App Repository.
  # ==================================================
  - name: orders-portal-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: orders-portal-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - ordersportalfailedorders.zip
          name: ordersportalfailedorders
          target-path: resources/
        - artifacts:
            - ordersportalallorders.zip
          name: ordersportalallorders
          target-path: resources/

  # ==================================================
  # 4) MANAGED HTML5 RUNTIME DESTINATION CONTENT
  # Registers one shared Orders Portal repository and
  # one shared XSUAA configuration for both HTML5 apps.
  # ==================================================
  - name: orders-portal-destination-content
    type: com.sap.application.content
    requires:
      - name: orders-portal-auth
        parameters:
          service-key:
            name: orders-portal-auth-key
      - name: orders-portal-repo-host
        parameters:
          service-key:
            name: orders-portal-html5-service-key
      - name: orders-portal-destination
        parameters:
          content-target: true
    parameters:
      content:
        instance:
          destinations:
            - Name: orders-portal-repo
              ServiceInstanceName: orders-portal-html5-service
              ServiceKeyName: orders-portal-html5-service-key
              sap.cloud.service: orders.portal

            - Name: orders-portal-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: orders-portal-auth
              ServiceKeyName: orders-portal-auth-key
              sap.cloud.service: orders.portal

          existing_destinations_policy: update
    build-parameters:
      no-source: true

  # ==================================================
  # 5) FAILED ORDERS HTML5 APP
  # ==================================================
  - name: ordersportalfailedorders
    type: html5
    path: app/failedorders
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  # ==================================================
  # 6) ALL ORDERS HTML5 APP
  # ==================================================
  - name: ordersportalallorders
    type: html5
    path: app/allorders
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

# ==================================================
# RESOURCES (BTP Managed Services)
# ==================================================
resources:
  # XSUAA: authentication, roles, and authorization.
  - name: orders-portal-auth
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        tenant-mode: dedicated
        xsappname: orders-portal-${org}-${space}
      path: ./xs-security.json
      service: xsuaa
      service-plan: application
      service-keys:
        - name: orders-portal-auth-key
    requires:
      - name: app-api

  # Destination service: backend routing and managed HTML5 discovery.
  - name: orders-portal-destination
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com

              # Work Zone managed AppRouter forwards its current user JWT
              # to the XSUAA-protected CAP backend.
              - Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                HTML5.Timeout: 60000
                Name: srv-api
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}

            existing_destinations_policy: update
      service: destination
      service-plan: lite
    requires:
      - name: srv-api

  # Connectivity service for the on-premise PostgreSQL tunnel.
  - name: orders-portal-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite

  # HTML5 App Repository host stores Failed Orders and All Orders content.
  - name: orders-portal-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: orders-portal-html5-service
      service-plan: app-host
      config:
        sizeLimit: 5
      service-keys:
        - name: orders-portal-html5-service-key

  # HTML5 App Repository runtime serves content to the standalone AppRouter.
  - name: orders-portal-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production